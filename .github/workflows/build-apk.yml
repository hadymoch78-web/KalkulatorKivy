name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool libltdl-dev autoconf automake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer Cython==0.29.33

      - name: Check build versions
        run: |
          python --version
          buildozer --version
          pip show buildozer cython
          pip show python-for-android || true

      - name: Build APK
        run: |
          buildozer android debug
